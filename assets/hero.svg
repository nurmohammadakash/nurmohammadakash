  <circle r="190" fill="#8b5cf6" fill-opacity=".55"><animate attributeName="cx" values="560;340;560" dur="22s" repeatCount="indefinite"/><animate attributeName="cy" values="120;260;120" dur="22s" repeatCount="indefinite"/></circle>
